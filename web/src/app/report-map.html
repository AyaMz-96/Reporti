<section class="map-page">
  <h2>Map</h2>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <div class="legend" aria-label="Legend">
    @for (item of legend; track item.label) {
      <span><i [style.background]="item.color"></i>{{ item.label }}</span>
    }
        <span class="hint">Outline:</span>
    @for (item of priorityLegend; track item.label) {
      <span><i class="ring" [style.border-color]="item.color"></i>{{ item.label }}</span>
    }
  </div>

  @if (loading()) {
    <p class="empty">Loading...</p>
  } @else {
    <p class="count">{{ reports().length }} report(s)</p>
  }

  <div #mapContainer class="map" aria-label="Map of reports"></div>
</section>
