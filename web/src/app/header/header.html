<header class="navbar">
  <a class="logo-area" routerLink="/" aria-label="Reporti home">
    <img class="logo-image" src="/reporti-logo.png" alt="" />
  </a>

  <nav class="nav-links" aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/report" routerLinkActive="active">Report</a>
    <a routerLink="/reports" routerLinkActive="active">Reports</a>
    <a routerLink="/map" routerLinkActive="active">Map</a>
    <a routerLink="/contact" routerLinkActive="active">Contact</a>
    <a routerLink="/about" routerLinkActive="active">About</a>
  </nav>

  <div class="nav-actions">
    <button type="button" class="login-btn" (click)="openLogin()">Login</button>

    <div class="language-control">
      <button
        type="button"
        class="lang-btn"
        aria-label="Select language"
        [attr.aria-expanded]="languageOpen()"
        (click)="toggleLanguages()"
      >{{ language() }}</button>

      @if (languageOpen()) {
        <div class="language-menu" role="menu" aria-label="Languages">
          <button type="button" role="menuitem" (click)="selectLanguage('EN')">
            <span>EN</span> English
          </button>
          <button type="button" role="menuitem" (click)="selectLanguage('AR')">
            <span>AR</span> Arabic
          </button>
          <button type="button" role="menuitem" (click)="selectLanguage('FR')">
            <span>FR</span> French
          </button>
        </div>
      }
    </div>

    <button type="button" class="header-icon-btn theme-btn" aria-label="Toggle dark mode" (click)="toggleTheme()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        @if (darkMode()) {
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
        } @else {
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        }
      </svg>
    </button>

    <app-notification-bell />
  </div>
</header>

@if (loginOpen()) {
  <div class="login-backdrop" (click)="closeLogin()">
    <section
      class="login-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="login-title"
      (click)="$event.stopPropagation()"
    >
      <button type="button" class="modal-close" aria-label="Close login message" (click)="closeLogin()">×</button>
      <span class="modal-icon" aria-hidden="true">R</span>
      <p class="modal-kicker">Reporti accounts</p>
      <h2 id="login-title">Login is coming soon</h2>
      <p class="modal-message">Login is a feature planned for the next Sprint.</p>
      <button type="button" class="modal-action" (click)="closeLogin()">Got it</button>
    </section>
  </div>
}
