<div class="bell">
  <button
    type="button"
    class="bell-button"
    aria-label="Notifications"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <span aria-hidden="true">🔔</span>
    @if (unreadCount() > 0) {
      <span class="badge">{{ unreadCount() }}</span>
    }
  </button>

  @if (open()) {
    <section class="panel">
      <header class="panel-header">
        <h2>Notifications</h2>
        @if (unreadCount() > 0) {
          <button type="button" class="link" (click)="markAllAsRead()">Mark all as read</button>
        }
      </header>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      @if (loading()) {
        <p class="empty">Loading...</p>
      } @else if (notifications().length === 0) {
        <p class="empty">No notifications yet.</p>
      } @else {
        <ul>
          @for (notification of notifications(); track notification.id) {
            <li [class.unread]="!notification.isRead">
              <button type="button" class="item" (click)="markAsRead(notification)">
                <span class="type">{{ label(notification) }}</span>
                <span class="message">{{ notification.message }}</span>
                <span class="date">{{ notification.createdAt | date: 'short' }}</span>
              </button>
            </li>
          }
        </ul>
      }
    </section>
  }
</div>
