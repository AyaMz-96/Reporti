spring.application.name=reporti
server.port=8090
# Loads local secrets from the .env file in the project root (git-ignored)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# The schema is managed in Supabase, never by Hibernate
